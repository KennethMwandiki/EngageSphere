name: CI · SBOM · SCA · Signed Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read

env:
  ARTIFACT_NAME: engagesphere
  SBOM_FORMAT: spdx
  SCA_FAIL_SEVERITY: critical

jobs:
  setup:
    name: Setup environment
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up QEMU (if building containers)
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          # adapt to repo (npm/pip/go)
          if [ -f package.json ]; then npm ci; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run linters
        run: |
          # adapt linter commands
          if [ -f package.json ]; then npm run lint --if-present; fi
      - name: Run tests
        run: |
          if [ -f package.json ]; then npm test --if-present; fi
          if [ -f pytest.ini ] || [ -d tests ]; then pytest -q || true; fi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ./test-results || ./reports || .

  sbom-sca:
    name: SBOM and SCA
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (Syft)
        uses: anchore/syft-action@v0.3.0
        with:
          output: sbom.${{ env.SBOM_FORMAT }}
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.${{ env.SBOM_FORMAT }}
      - name: Run SCA (example: Trivy filesystem)
        uses: aquasecurity/trivy-action@v0.7.0
        with:
          format: 'json'
          output: trivy-results.json
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
      - name: Fail on severities
        id: sca-check
        run: |
          jq -r '.Results[]?.Vulnerabilities[]?.Severity' trivy-results.json | grep -i CRITICAL && (echo "Critical vulnerability found" && exit 1) || echo "No critical vulnerabilities"

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    needs: sbom-sca
    steps:
      - uses: actions/checkout@v4
      - name: Run SAST placeholder
        run: |
          # Replace the following with your SAST tool invocation (e.g., semgrep)
          if command -v semgrep &gt;/dev/null 2&gt;&1; then semgrep --config auto --json --output semgrep-results.json || true; fi
      - name: Upload SAST results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-results
          path: semgrep-results.json || .

  build-and-package:
    name: Build and package artifacts
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4
      - name: Build artifact
        run: |
          # Adapt this block to build binaries, web bundles, or container images
          if [ -f package.json ]; then npm run build --if-present; tar -czf ${ARTIFACT_NAME}-web.tgz dist || true; fi
          if [ -f Dockerfile ]; then docker build -t ${ARTIFACT_NAME}:$GITHUB_SHA .; docker save ${ARTIFACT_NAME}:$GITHUB_SHA | gzip &gt; ${ARTIFACT_NAME}-image-${GITHUB_SHA}.tar.gz || true; fi
      - name: Create checksums
        run: |
          for f in ${ARTIFACT_NAME}*.tgz ${ARTIFACT_NAME}*.tar.gz || true; do
            if [ -f "$f" ]; then sha256sum "$f" &gt; "$f.sha256"; fi
          done
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            ${ARTIFACT_NAME}-*.tgz
            ${ARTIFACT_NAME}-*.tar.gz
            *.sha256

  sign-and-release:
    name: Sign and create release (protected)
    runs-on: ubuntu-latest
    needs: build-and-package
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then echo "$GPG_PRIVATE_KEY" | gpg --batch --import; fi
      - name: Sign artifacts
        run: |
          for f in ${ARTIFACT_NAME}*.tgz ${ARTIFACT_NAME}*.tar.gz || true; do
            if [ -f "$f" ]; then gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" -ab "$f"; fi
          done
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}-${{ github.sha }}
          name: Release v${{ github.run_number }}-${{ github.sha }}
          body: |
            Automated release produced by CI.
            Artifacts: build artifacts, SBOM, SCA, SAST reports.
      - name: Upload signed assets to release
        uses: softprops/action-gh-release@v1
        with:
          files: '*.tgz,*.tar.gz,*.asc,*.sha256,*.json'
      - name: Notify security owners
        run: echo "Release draft created; require manual approval in environment before publishing"